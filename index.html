<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korrin's Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" onclick="navigate('home')">Korrin's<span>.</span></a>
    <ul class="nav-links" id="mainNav">
      <li><a onclick="navigate('portfolio')" data-page="portfolio">Portfolio</a></li>
      <li><a onclick="navigate('booking')" data-page="booking">Booking</a></li>
      <li><a onclick="navigate('login')" class="nav-cta" data-page="login">Client Login</a></li>
    </ul>
  </nav>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="prevPhoto()">&#8592;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" oncontextmenu="return false;" draggable="false">
    <button class="lightbox-nav lightbox-next" onclick="nextPhoto()">&#8594;</button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
    <div class="lightbox-info" id="lightboxInfo"></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- PAGES MOUNT POINT -->
  <div id="app"></div>

  <!-- SCRIPTS — order matters: data first, then modules, then init last -->
  <script src="js/data.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/render.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/init.js"></script>

</body>
</html>
